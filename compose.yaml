name: ONLINE MART PROJECT
services:
  # Product-service:
  product-service-api:
    container_name: ProductService-ApiContainer
    build:
      context: ./product-service
      dockerfile: Dockerfile.dev

    volumes:
      - ./product-service:/code # Sync local development directory with the container
    depends_on:
      - product-service-db
      - broker
    ports:
      - "8000:8000" # Expose container port 8000 to host port 8000
  product-service-db:
    image: postgres:latest # Use the official PostgreSQL image
    restart: always
    container_name: ProductService-PostgresContainer
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - product-service-db:/var/lib/postgresql/data

