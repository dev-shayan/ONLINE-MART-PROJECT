# version: "3.9"

name: mart

services:
  # Product Service
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./product-service:/code
    depends_on:
      - postgres_product_db
      - broker
    ports:
      - "8006:8006"

  # Product Database
  postgres_product_db:
    image: postgres:latest
    restart: always
    container_name: PostgresProductCont
    environment:
      - POSTGRES_USER=Shayankhan
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=product_db
    ports:
      - '5436:5432'
    volumes:
      - postgres_product_db:/var/lib/postgresql/data

  # Inventory Service
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./inventory-service:/code
    depends_on:
      - postgres_inventory_db
      - broker
    ports:
      - "8007:8007"

  # Inventory Database
  postgres_inventory_db:
    image: postgres:latest
    restart: always
    container_name: PostgresInventoryCont
    environment:
      - POSTGRES_USER=Shayankhan
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=inventory_db
    ports:
      - '5437:5432'
    volumes:
      - postgres_inventory_db:/var/lib/postgresql/data

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./user-service:/code
    depends_on:
      - postgres_user_db
      - broker
    ports:
      - "8008:8008"

  # User Database
  postgres_user_db:
    image: postgres:latest
    restart: always
    container_name: PostgresUserCont
    environment:
      - POSTGRES_USER=Shayankhan
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=user_db
    ports:
      - '5438:5432'
    volumes:
      - postgres_user_db:/var/lib/postgresql/data

  broker:
    image: apache/kafka:3.7.0
    hostname: broker
    container_name: broker
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'Local Kafka Cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'broker:19092'
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - broker

volumes:
  postgres_product_db:
    driver: local
  postgres_inventory_db:
    driver: local
  postgres_user_db:
    driver: local

networks:
  default:
    driver: bridge
